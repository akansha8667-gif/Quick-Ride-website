<!DOCTYPE html>
<html>
<head>
    <title>Ride History - Quick-Ride</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h2>Your Ride History</h2>
    <a href="index.html">Back to Home</a>
    
    <table>
        <thead>
            <tr>
                <th>Ride ID</th>
                <th>Pickup</th>
                <th>Dropoff</th>
                <th>Fare</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="history-list">
            </tbody>
    </table>

    <script>
    window.onload = async () => {
        try {
            const res = await fetch('api/ride_history.php');
            const data = await res.json();
            
            const tableBody = document.getElementById('history-list');
            if(data.success && data.rides.length > 0) {
                tableBody.innerHTML = data.rides.map(ride => `
                    <tr>
                        <td>${ride.id}</td>
                        <td>${ride.pickup_location}</td>
                        <td>${ride.dropoff_location}</td>
                        <td>₹${ride.fare}</td>
                        <td>${ride.status}</td>
                    </tr>
                `).join('');
            } else {
                tableBody.innerHTML = "<tr><td colspan='5'>No rides found.</td></tr>";
            }
        } catch (err) {
            console.error("Error fetching history:", err);
        }
    };
    </script>
</body>
</html>
